<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex Quota Guard</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-lockup">
          <div class="brand-mark" aria-hidden="true">CQ</div>
          <div>
            <p class="eyebrow">Team workspace</p>
            <h1>Codex Quota Guard</h1>
          </div>
        </div>
        <div class="connection" aria-live="polite">
          <span class="connection-dot" id="connection-dot" aria-hidden="true"></span>
          <span id="service-status">正在连接本地服务…</span>
          <button class="icon-button" id="refresh-status" type="button" aria-label="刷新状态" title="刷新状态">&#8635;</button>
        </div>
      </header>

      <main>
        <section class="workspace-heading" aria-labelledby="room-name">
          <div>
            <p class="eyebrow">共享房间</p>
            <h2 id="room-name">正在读取房间…</h2>
            <p class="muted" id="room-meta">已验证成员和额度快照会显示在这里。</p>
          </div>
          <div class="sync-block">
            <span class="muted">最后同步</span>
            <strong id="last-sync">--</strong>
          </div>
        </section>

        <section class="metrics" aria-label="额度概览">
          <article class="metric metric-green">
            <span class="metric-label">在线成员</span>
            <strong id="member-count">--</strong>
            <span class="metric-note" id="member-summary">等待房间数据</span>
          </article>
          <article class="metric metric-blue">
            <span class="metric-label">已登录账号</span>
            <strong id="authenticated-count">--</strong>
            <span class="metric-note">已获得服务端额度</span>
          </article>
          <article class="metric metric-orange">
            <span class="metric-label">需要关注</span>
            <strong id="warning-count">--</strong>
            <span class="metric-note">签名或同步 warning</span>
          </article>
        </section>

        <section class="panel" aria-labelledby="members-title">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Member monitoring</p>
              <h2 id="members-title">额度概览</h2>
            </div>
            <span class="muted" id="member-updated">--</span>
          </div>
          <div class="member-grid" id="members" aria-live="polite"></div>
        </section>

        <section class="notice" id="room-state" aria-live="polite">
          <span class="notice-icon" aria-hidden="true">i</span>
          <p id="room-state-text">正在读取共享房间状态。</p>
        </section>
      </main>
    </div>
    <script type="module" src="/renderer.mjs"></script>
  </body>
</html>
