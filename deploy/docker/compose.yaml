name: codex-quota-guard

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: quota_guard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run deploy.sh init first}
      APP_DB_PASSWORD: ${DATABASE_PASSWORD:?Database password is required}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/10-quota-guard.sql:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d quota_guard"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    shm_size: 128mb
    logging: *logging

  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
      target: runtime
    restart: unless-stopped
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Explicit deployment policy shared with local/test defaults.
      # false accepts HTTP and HTTPS, including management credentials.
      # HTTP is unencrypted; compose.https.yaml enables HTTPS-only ingress.
      APP_REQUIRE_HTTPS: "false"
      DATABASE_URL: jdbc:postgresql://postgres:5432/quota_guard
      DATABASE_USERNAME: quota_guard
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Database password is required}
      JWT_SECRET: ${JWT_SECRET:?JWT secret is required}
      JWT_ISSUER: ${JWT_ISSUER:-codex-quota-guard}
      MAIL_ASSISTANCE_ENCRYPTION_KEY: ${MAIL_ASSISTANCE_ENCRYPTION_KEY:?Preserve the mailbox encryption key}
      # Preserve existing keys. Missing official-session keys also prevent new bindings.
      OFFICIAL_SESSION_ENCRYPTION_KEY: ${OFFICIAL_SESSION_ENCRYPTION_KEY:-}
      OFFICIAL_AUTHORIZATION_PRESET_FILE: /run/secrets/official-authorization.json
      MANAGED_PROXY_ENCRYPTION_KEY: ${MANAGED_PROXY_ENCRYPTION_KEY:-}
      MANAGED_PROXY_MAX_PROCESSES: ${MANAGED_PROXY_MAX_PROCESSES:-4}
      MANAGED_PROXY_ALLOW_PRIVATE_NODES: ${MANAGED_PROXY_ALLOW_PRIVATE_NODES:-false}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ADMIN_BOOTSTRAP_DISPLAY_NAME: Administrator
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?Set the public web origin}
      SERVER_ADDRESS: 0.0.0.0
      WEB_SERVER_PORT: "8080"
      DESKTOP_UPDATE_STORAGE_DIR: /var/lib/quota-guard/releases
      APP_DESKTOP_UPDATE_STORAGE_DIR: /var/lib/quota-guard/releases
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -Duser.timezone=UTC
    depends_on:
      postgres:
        condition: service_healthy
    networks: [database, application]
    volumes:
      - desktop_releases:/var/lib/quota-guard/releases
      - type: bind
        source: ./secrets
        target: /run/secrets
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    healthcheck:
      # Authentication returns 401, or redirects with 302 in explicit HTTPS-only mode.
      # This fixed local probe verifies transport/authentication, not the database.
      test: [CMD-SHELL, "code=$$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 3 http://127.0.0.1:8080/api/v1/users/me) && { test \"$$code\" = 401 || test \"$$code\" = 302; }"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging: *logging

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks: [application]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    logging: *logging

volumes:
  pgdata:
  desktop_releases:

networks:
  database:
    internal: true
  # Must allow outbound IMAPS, OAuth HTTPS and DNS for login assistance.
  application:
