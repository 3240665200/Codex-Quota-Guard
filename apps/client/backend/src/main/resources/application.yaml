server:
  address: 127.0.0.1
  port: 47821
  error:
    include-message: never

spring:
  application:
    name: codex-quota-guard

quota-guard:
  api-token: ${QUOTA_GUARD_API_TOKEN:}
  control-plane:
    # The desktop shell validates and passes the selected central origin.
    # Remote HTTP is disabled unless the user explicitly approves a private LAN address.
    base-url: ${QUOTA_GUARD_CONTROL_PLANE_URL:http://127.0.0.1:8080}
    allow-insecure-lan-http: ${QUOTA_GUARD_ALLOW_INSECURE_LAN_HTTP:false}
