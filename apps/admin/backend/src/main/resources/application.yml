spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  flyway:
    enabled: true
    validate-on-migrate: ${FLYWAY_VALIDATE_ON_MIGRATE:true}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${WEB_SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt-secret: ${JWT_SECRET}
  jwt-issuer: ${JWT_ISSUER:codex-quota-guard}
  access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
  refresh-token-ttl: ${REFRESH_TOKEN_TTL:30d}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:1420,http://localhost:3000,http://localhost:8000}
  auth-rate-limit-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:20}
  require-https: ${APP_REQUIRE_HTTPS:${REQUIRE_HTTPS:false}}
  admin-bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
  admin-bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  admin-bootstrap-display-name: ${ADMIN_BOOTSTRAP_DISPLAY_NAME:Administrator}
